name: daylog
description: A daily diary app with mood tracking and calendar heatmap.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  table_calendar: ^3.1.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  image_picker: ^1.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
